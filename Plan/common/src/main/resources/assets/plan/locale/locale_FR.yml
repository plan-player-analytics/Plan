                    line-9: "<1>{{permission1}}</1> les autorisations permettent à l'utilisateur d'adresser une demande à une adresse spécifique, par exemple. <2>{{permission2}}</2> permet de faire une requête à /network."
            performance:
                cpu: "Plus grande valeur observée rapportée par Java pendant la minute."
                cpuImpactPerPlayer: "(Utilisation CPU moyenne en activité - Utilisation CPU moyenne inactif) / Joueurs en ligne"
                desc-1: "Les métriques de performance sont collectées via une tâche qui s'exécute une fois par seconde, puis stockées une fois par minute."
                desc-2: "Certaines métriques sont calculées de manière asynchrone pour éviter d'impacter la vitesse de tick."
                diskSpace: "Plus petite valeur observée rapportée par Java pendant la minute."
                entities: "Plus grand nombre d'entités observées existant à un moment donné pendant une minute. Certains serveurs déchargent les chunks et entités sans joueurs."
                explanation: "Explication"
                loadedChunks: "Plus grand nombre de chunks chargés observés à un moment donné pendant une minute. Certains serveurs déchargent les chunks et entités sans joueurs. Non disponible sur les serveurs Sponge en raison de l'impact sur les performances."
                lowTpsSpikes: "Lorsque la valeur TPS enregistrée est inférieure à Display_options.Graphs.TPS.Medium_threshold, elle est comptée comme TPS bas. Le comptage des pics n'augmente que lorsque la valeur enregistrée est revenue au-dessus du seuil."
                maxFreeDisk: "Plus grand espace disque enregistré par Plan dans l'intervalle de temps."
                metric: "Métrique"
                minFreeDisk: "Plus petit espace disque enregistré par Plan dans l'intervalle de temps."
                mspt: "Millisecondes par tick. Lorsqu'un tick de jeu prend plus de 50 millisecondes, il est perçu comme un lag. Le serveur Minecraft calcule les nanosecondes de chaque tick. Plan stocke la moyenne et le 95e percentile une fois par minute."
                msptImpactChunk: "MSPT moyen / Chunks chargés."
                msptImpactPlayer: "MSPT moyen / Joueurs en ligne."
                msptJitterAverage: "Le jitter décrit combien la valeur a changé entre les ticks successifs. Plus bas signifie un taux de tick plus stable. MSPT de 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Moyenne=23. La moyenne est utilisée pour éviter de stocker 1200 valeurs par minute."
                msptJitterMax: "Le jitter max prend le plus grand changement de tick subséquent. Plus élevé signifie qu'un pic de lag potentiel s'est produit. MSPT de 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Max=46"
                msptPercentile: "Le 95e percentile signifie que 95% des valeurs sont inférieures à cette valeur. C'est une sorte de maximum qui élimine les valeurs aberrantes."
                ping: "Délai mesuré par le serveur Minecraft entre l'envoi et la réception des paquets par le client de jeu. La tâche s'exécute toutes les 2 secondes, et le Min/Max/Moyenne est collecté pour chaque joueur séparément une fois par minute. Il y a certains délais dans la config (Ping_server_enable_delay - par défaut 10 minutes, Ping_player_join_delay - par défaut 30 secondes) qui filtrent les données incorrectes."
                playersOnline: "La valeur du graphique est le maximum observé pendant la minute."
                ram: "Plus grande valeur observée rapportée par Java pendant la minute."
                serverDowntime: "Somme des intervalles où Plan n'a pas enregistré de données. Commence à partir du premier point de données avant l'intervalle dans la plage de temps. Si la collecte de données s'arrête brusquement, l'intervalle n'est pas compté jusqu'à l'arrivée du prochain point de données."
                serverUptime: "Somme des sections de temps où Plan a enregistré des données. Commence à partir du premier point de données disponible dans la plage de temps."
                title: "Métriques de performance expliquées"
                tps: "Ticks de jeu par seconde. Minecraft fonctionne à 20 ticks par seconde. La valeur du graphique est la plus petite valeur observée pendant la minute. Les valeurs supérieures à 20 peuvent signifier un overticking où le serveur rattrape les ticks précédents."
            playtimeUnit: "heures"
            retention:
                calculationStep1: "Les données sont d'abord filtrées à l'aide de l'option '<>'. Tous les joueurs avec 'registerDate' en dehors de l'intervalle de temps sont ignorés."
                calculationStep2: "Il est ensuite réparti en groupes de joueurs à l'aide de l'option '<0>', par exemple. Avec '<1>': Tous les joueurs qui se sont inscrits en janvier 2023, février 2023, etc."
                calculationStep3: "Les options '<0>' et '<1>' permettent ensuite de sélectionner la visualisation à restituer."
                calculationStep4: "'<>' détermine le nombre de points du graphique, par exemple 'Jours' correspond à un point par jour."
                calculationStep5: "A chaque point calculé, tous les joueurs sont contrôlés pour la condition."
                calculationStep6: "Sélectionnez l'axe X ci-dessous pour voir les conditions."
                calculationStepDate: "Cette visualisation montre les différents groupes de joueurs qui jouent encore sur votre serveur. La visualisation utilise la date lastSeen. Si x < lastSeenDate, le joueur est visible sur le graphique."
                calculationStepDeltas: "Cette visualisation est plus efficace si l'on utilise le nombre de joueurs comme axe des ordonnées. La visualisation montre le gain net de joueurs (combien de joueurs se sont inscrits moins les joueurs qui ont arrêté de jouer). La visualisation utilise les dates d'inscription et de dernière visite. Si registerDate < x < lastSeenDate, le joueur est visible sur le graphique."
                calculationStepPlaytime: "Cette visualisation indique combien de temps la boucle de gameplay maintient l'attention des joueurs sur votre serveur. La visualisation utilise le temps de jeu. Si x < temps de jeu, le joueur est visible sur le graphique."
                calculationStepTime: "Cette visualisation indique combien de temps les gens reviennent jouer sur le serveur après leur première inscription. La visualisation utilise timeDifference. Si x < timeDifference, le joueur est visible sur le graphique."
