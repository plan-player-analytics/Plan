            description: "Changer rapidement de base de données"
            inDepth: "Recharge le plugin avec l'autre base de données et modifie la configuration en conséquence."
        dbMerge:
            description: "Fusionner les données de deux bases de données"
            inDepth: "Fusionne le contenu d'une base de données avec le contenu d'une autre. Les données source seront insérées dans la base de destination."
