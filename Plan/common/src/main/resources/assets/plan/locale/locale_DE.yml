                    line-11: "<1>{{permission1}}</1>-Berechtigungen sind für Daten nicht erforderlich: <2>{{permission2}}</2> ermöglicht Anfragen an /v1/network/overview, auch ohne <3>{{permission3}}</3>."
                    line-12: "Änderungen speichern"
                    line-13: "Wenn du eine Gruppe hinzufügst oder löschst, wird diese Aktion sofort nach der Bestätigung gespeichert (kein Rückgängig)."
                    line-14: "Wenn du Berechtigungen änderst, müssen diese Änderungen durch Drücken der Schaltfläche Speichern gespeichert werden."
                    line-15: "Dokumentation findest du unter <1>{{link}}</1>"
                    line-2: "Die Web-Gruppe des Benutzers wird während <1>{{command}}</1> bestimmt, indem geprüft wird, ob der Spieler die <2>{{permission}}</2>-Berechtigung hat."
                    line-3: "Du kannst <1>{{command}}</1> verwenden, um die Berechtigungsgruppe nach der Registrierung zu ändern."
                    line-4: "<1>{{icon}}</1> Wenn du versehentlich alle Gruppen mit <2>{{permission}}</2>-Berechtigung löschst, führe einfach <3>{{command}}</3> aus."
                    line-5: "Berechtigungserbfolge"
                    line-6: "Berechtigungen folgen einem Erbfolgemodell, bei dem höhere Berechtigungen alle niedrigeren gewähren, z. B. <1>{{permission1}}</1> gibt auch <2>{{permission2}}</2>, usw."
                    line-7: "Zugriffs- vs. Seitenberechtigungen"
                    line-8: "Du musst Benutzern sowohl Zugriffs- als auch Seitenberechtigungen zuweisen."
                    line-9: "<1>{{permission1}}</1>-Berechtigungen ermöglichen es dem Benutzer, Anfragen an bestimmte Adressen zu stellen, z. B. <2>{{permission2}}</2> ermöglicht Anfragen an /network."
            performance:
                cpu: "Größter beobachteter Wert, der von Java während der Minute gemeldet wurde."
                cpuImpactPerPlayer: "(Durchschnittliche CPU-Auslastung bei Aktivität - Durchschnittliche CPU-Auslastung im Leerlauf) / Online-Spieler"
                desc-1: "Leistungsmetriken werden über eine Aufgabe gesammelt, die einmal pro Sekunde läuft, und dann einmal pro Minute gespeichert."
                desc-2: "Einige Metriken werden asynchron berechnet, um die Tick-Geschwindigkeit nicht zu beeinträchtigen."
                diskSpace: "Kleinster beobachteter Wert, der von Java während der Minute gemeldet wurde."
                entities: "Größte beobachtete Anzahl von Entitäten, die zu einem Zeitpunkt während einer Minute existierten. Einige Server entladen Chunks und Entitäten ohne Spieler."
                explanation: "Erklärung"
                loadedChunks: "Größte beobachtete Anzahl von Chunks, die zu einem Zeitpunkt während einer Minute geladen waren. Einige Server entladen Chunks und Entitäten ohne Spieler. Nicht auf Sponge-Servern verfügbar aufgrund von Leistungsbeeinträchtigungen."
                lowTpsSpikes: "Wenn der aufzeichnete TPS-Wert unter Display_options.Graphs.TPS.Medium_threshold liegt, wird er als niedrige TPS gezählt. Die Spitzenzahl erhöht sich nur, wenn der aufzeichnete Wert über den Schwellenwert zurückkehrt."
                maxFreeDisk: "Größter von Plan im Zeitraum aufzeichneter Festplattenspeicher."
                metric: "Metrik"
                minFreeDisk: "Kleinster von Plan im Zeitraum aufzeichneter Festplattenspeicher."
                mspt: "Millisekunden pro Tick. Wenn ein Game-Tick über 50 Millisekunden dauert, wird er als Lag wahrgenommen. Der Minecraft-Server berechnet Nanosekunden jedes Ticks. Plan speichert den Durchschnitt und den 95. Perzentil einmal pro Minute."
                msptImpactChunk: "Durchschnittliche MSPT / Geladene Chunks."
                msptImpactPlayer: "Durchschnittliche MSPT / Online-Spieler."
                msptJitterAverage: "Jitter beschreibt, wie stark sich der Wert zwischen aufeinanderfolgenden Ticks geändert hat. Niedriger bedeutet stabilere Tick-Rate. MSPT von 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Durchschnitt=23. Der Durchschnitt wird verwendet, um 1200 Werte pro Minute speichern zu müssen."
                msptJitterMax: "Max-Jitter nimmt die größte Änderung zwischen aufeinanderfolgenden Ticks. Höher bedeutet, dass ein möglicher Lag-Spike aufgetreten ist. MSPT von 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Max=46"
                msptPercentile: "95. Perzentil bedeutet, dass 95% der Werte unter diesem Wert liegen. Es ist eine Art Maximum, das Ausreißer ausschließt."
                ping: "Verzögerung, die vom Minecraft-Server zwischen dem Senden und Empfangen von Paketen durch den Game-Client gemessen wird. Die Aufgabe läuft alle 2 Sekunden, und Min/Max/Durchschnitt wird von jedem Spieler separat einmal pro Minute gesammelt. Es gibt einige Verzögerungen in der Konfiguration (Ping_server_enable_delay - Standard 10 Minuten, Ping_player_join_delay - Standard 30 Sekunden), die Mülldaten vom Aufzeichnen filtern."
                playersOnline: "Diagrammwert ist das Maximum, das innerhalb der Minute beobachtet wurde."
                ram: "Größter beobachteter Wert, der von Java während der Minute gemeldet wurde."
                serverDowntime: "Summe der Lücken, in denen Plan keine Daten aufgezeichnet hat. Beginnt vom ersten Datenpunkt vor der Lücke innerhalb des Zeitraums. Wenn die Datenerfassung abrupt endet, wird die Lücke nicht gezählt, bis der nächste Datenpunkt eintrifft."
                serverUptime: "Summe der Zeitspannen, in denen Plan Daten aufgezeichnet hat. Beginnt vom ersten verfügbaren Datenpunkt innerhalb des Zeitraums."
                title: "Leistungsmetriken erklärt"
                tps: "Game-Ticks pro Sekunde. Minecraft läuft mit 20 Ticks pro Sekunde. Diagrammwert ist der kleinste innerhalb der Minute beobachtete Wert. Werte über 20 können Overticking bedeuten, bei dem der Server vorherige Ticks nachholt."
            playtimeUnit: "Stunden"
            retention:
                calculationStep1: "Zuerst werden die Daten mit der '<>'-Option gefiltert. Alle Spieler mit 'registerDate' außerhalb des Zeitraums werden ignoriert."
                calculationStep2: "Dann werden sie mit der '<0>'-Option in Spielergruppen gruppiert, z. B. mit '<1>': Alle Spieler, die sich im Januar 2023, Februar 2023 usw. registriert haben."
                calculationStep3: "Dann wählen die '<0>'- und '<1>'-Optionen, welche Visualisierung gerendert werden soll."
                calculationStep4: "'<>' steuert, wie viele Punkte das Diagramm hat, z. B. 'Tage' hat einen Punkt pro Tag."
                calculationStep5: "An jedem berechneten Punkt werden alle Spieler auf die Bedingung überprüft."
                calculationStep6: "Wähle unten die X-Achse aus, um die Bedingungen zu sehen."
                calculationStepDate: "Diese Visualisierung zeigt die verschiedenen Gruppen von Spielern, die noch auf deinem Server spielen. Die Visualisierung verwendet das lastSeen-Datum. Wenn x < lastSeenDate, ist der Spieler im Diagramm sichtbar."
                calculationStepDeltas: "Diese Visualisierung ist am effektivsten mit Spieleranzahl als Y-Achse. Die Visualisierung zeigt den Nettogewinn an Spielern (Wie viele Spieler beigetreten minus Spieler, die aufgehört haben zu spielen). Die Visualisierung verwendet sowohl registrierte als auch lastSeen-Daten. Wenn registerDate < x < lastSeenDate, ist der Spieler im Diagramm sichtbar."
                calculationStepPlaytime: "Diese Visualisierung zeigt, wie lange die Gameplay-Schleife Spieler auf deinem Server bindet. Die Visualisierung verwendet die Spielzeit. Wenn x < Spielzeit, ist der Spieler im Diagramm sichtbar."
                calculationStepTime: "Diese Visualisierung zeigt, wie lange Leute nach dem ersten Beitritt weiter auf dem Server spielen. Die Visualisierung verwendet timeDifference. Wenn x < timeDifference, ist der Spieler im Diagramm sichtbar."
                compareJoinAddress: "Gruppierung nach Beitrittsadresse ermöglicht das Messen von Werbekampagnen auf verschiedenen Seiten."
                compareMonths: "Du kannst verschiedene Monate vergleichen, indem du die '<0>'-Option in '<1>' änderst."
                examples:
                    adCampaign: "Vergleich des Spielerzuwachses verschiedener Werbekampagnen mit verschiedenen Beitrittsadressen (anonymisiert)"
                    deltas: "<> zeigt den Nettogewinn an Spielern."
                    pattern: "Ein allgemeines Muster entsteht, wenn alle Spieler zur gleichen Zeit den Server verlassen."
                    plateau: "Vergleich des Spielerzuwachses verschiedener Monate. Plateaus deuten darauf hin, dass es Spieler gab, die Plan nicht kannte. In diesem Beispiel wurde Plan im Januar 2022 installiert."
                    playtime: "Die Spielzeit zeigt, wie lange die Gameplay-Schleife Spieler auf deinem Server bindet."
                    stack: "Kumulativer Spielerzuwachs kann mit gestapelter Spieleranzahl als Y-Achse überprüft werden."
                howIsItCalculated: "Wie es berechnet wird"
                howIsItCalculatedData: "Das Diagramm wird aus Spielerdaten generiert:"
                options: "Wähle die Optionen aus, um verschiedene Aspekte der Spielerbindung zu analysieren."
