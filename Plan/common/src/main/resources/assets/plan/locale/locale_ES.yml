                desc-1: "Las métricas de rendimiento se recopilan mediante una tarea que se ejecuta una vez por segundo y luego se almacenan una vez por minuto."
                desc-2: "Algunas métricas se calculan de forma asíncrona para evitar afectar la velocidad de los ticks."
                diskSpace: "El menor valor observado reportado por Java durante el minuto."
                entities: "El mayor número observado de entidades existentes en un momento durante un minuto. Algunos servidores descargan chunks y entidades sin jugadores."
