                lowTpsSpikes: "Cuando el valor de TPS registrado está por debajo de Display_options.Graphs.TPS.Medium_threshold se cuenta como TPS bajo. El conteo de picos solo aumenta cuando el valor registrado ha vuelto a estar por encima del umbral."
