                mspt: "Milisegundos por tick. Cuando un tick del juego tarda más de 50 milisegundos se percibe como lag. El servidor de Minecraft computa los nanosegundos de cada tick. Plan almacena el promedio y el percentil 95 una vez por minuto."
                msptImpactChunk: "MSPT promedio / Chunks cargados."
                msptImpactPlayer: "MSPT promedio / Jugadores en línea."
                msptJitterAverage: "El jitter describe cuánto cambió el valor entre ticks posteriores. Menor significa una tasa de tick más estable. MSPT de 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Promedio=23. El promedio se usa para evitar necesitar almacenar 1200 valores por minuto."
                msptJitterMax: "El jitter máximo toma el mayor cambio de tick posterior. Mayor significa que ocurrió un posible pico de lag. MSPT de 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Máximo=46"
                msptPercentile: "El percentil 95 significa que el 95% de los valores están por debajo de este valor. Es una especie de máximo que descarta valores atípicos."
                ping: "Retardo medido por el servidor de Minecraft entre los paquetes enviados y recibidos por el cliente del juego. La tarea se ejecuta cada 2 segundos, y el Mínimo/Máximo/Promedio se recopila por separado para cada jugador una vez por minuto. Hay algunos retardos en la configuración (Ping_server_enable_delay - predeterminado 10 minutos, Ping_player_join_delay - predeterminado 30 segundos) que filtran los datos basura para que no se registren."
                playersOnline: "El valor del gráfico es el máximo observado dentro del minuto."
                ram: "El mayor valor observado reportado por Java durante el minuto."
                serverDowntime: "Suma de los intervalos cuando Plan no ha registrado datos. Comienza desde el primer punto de datos antes del intervalo dentro del período. Si la recopilación de datos termina abruptamente, el intervalo no se cuenta hasta que llegue el siguiente punto de datos."
                serverUptime: "Suma de secciones de tiempo cuando Plan ha registrado datos. Comienza desde el primer punto de datos disponible dentro del período."
                title: "Métricas de rendimiento explicadas"
                tps: "Ticks del juego por segundo. Minecraft se ejecuta a 20 ticks por segundo. El valor del gráfico es el menor valor observado dentro del minuto. Valores mayores a 20 pueden significar overticking donde el servidor se está recuperando de ticks anteriores."
            playtimeUnit: "hours"
            retention:
