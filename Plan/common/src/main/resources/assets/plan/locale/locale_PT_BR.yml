            performance:
                cpu: "Maior valor observado reportado pelo Java durante o minuto."
                cpuImpactPerPlayer: "(Uso médio de CPU enquanto ativo - Uso médio de CPU enquanto ocioso) / Jogadores online"
                desc-1: "Métricas de desempenho são coletadas via tarefa que roda uma vez por segundo, e então armazenadas uma vez por minuto."
                desc-2: "Algumas métricas são computadas async para evitar impacto na velocidade do tick."
                diskSpace: "Menor valor observado reportado pelo Java durante o minuto."
                entities: "Maior número observado de entidades existentes em um momento durante um minuto. Alguns servidores descarregam chunks e entidades sem jogadores."
                explanation: "Explicação"
                loadedChunks: "Maior número observado de chunks carregados em um momento durante um minuto. Alguns servidores descarregam chunks e entidades sem jogadores. Não disponível em servidores Sponge devido ao impacto no desempenho."
                lowTpsSpikes: "Quando o valor de TPS registrado está abaixo de Display_options.Graphs.TPS.Medium_threshold, é contado como TPS Baixo. A contagem de picos só aumenta quando o valor registrado retorna acima do limite."
                maxFreeDisk: "Maior espaço em disco registrado pelo Plan dentro do período."
                metric: "Métrica"
                minFreeDisk: "Menor espaço em disco registrado pelo Plan dentro do período."
                mspt: "Milissegundos por tick. Quando um tick de jogo leva mais de 50 milissegundos, é percebido como lag. O servidor Minecraft computa nanossegundos de cada tick. O Plan armazena a média e o percentil 95 uma vez por minuto."
                msptImpactChunk: "MSPT Médio / Chunks carregados."
                msptImpactPlayer: "MSPT Médio / Jogadores online."
                msptJitterAverage: "Jitter descreve quanto o valor mudou entre ticks subsequentes. Menor significa taxa de tick mais estável. MSPT de 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Média=23. Média é usada para evitar precisar armazenar 1200 valores por minuto."
                msptJitterMax: "Jitter Máximo pega a maior mudança de tick subsequente. Maior significa que um potencial pico de lag ocorreu. MSPT de 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Máx=46"
                msptPercentile: "Percentil 95 significa que 95% dos valores estão abaixo deste valor. É uma espécie de máximo que elimina valores discrepantes."
                ping: "Atraso medido pelo servidor Minecraft entre pacotes sendo enviados e recebidos pelo cliente de jogo. A tarefa roda a cada 2 segundos, e Min/Máx/Média é coletada de cada jogador separadamente uma vez por minuto. Existem alguns atrasos na configuração (Ping_server_enable_delay - padrão 10 minutos, Ping_player_join_delay - padrão 30 segundos) que filtram dados inválidos de serem registrados."
                playersOnline: "Valor do gráfico é o máximo observado dentro do minuto."
                ram: "Maior valor observado reportado pelo Java durante o minuto."
                serverDowntime: "Soma dos intervalos quando o Plan não registrou dados. Começa do primeiro ponto de dados antes do intervalo dentro do período. Se a coleta de dados termina abruptamente, o intervalo não é contado até que o próximo ponto de dados chegue."
                serverUptime: "Soma das seções de tempo quando o Plan registrou dados. Começa do primeiro ponto de dados disponível dentro do período."
                title: "Métricas de desempenho explicadas"
                tps: "Ticks de jogo por segundo. Minecraft roda a 20 ticks por segundo. Valor do gráfico é o menor valor observado dentro do minuto. Valores maiores que 20 podem significar overticking onde o servidor está compensando ticks anteriores."
            playtimeUnit: "horas"
            retention:
                calculationStep1: "Primeiro os dados são filtrados usando a opção '<>'. Jogadores com 'registerDate' fora do intervalo de tempo são ignorados."
                calculationStep2: "Depois é agrupado em grupos de jogadores usando a opção '<0>', ex. Com '<1>': Todos os jogadores que registraram em Janeiro 2023, Fevereiro 2023, etc"
                calculationStep3: "Então as opções '<0>' e '<1>' selecionam qual visualização renderizar."
                calculationStep4: "'<>' controla quantos pontos o gráfico tem, ex. 'Dias' tem um ponto por dia."
                calculationStep5: "Em cada ponto calculado, todos os jogadores são verificados para a condição."
                calculationStep6: "Selecione o Eixo X abaixo para ver condições."
                calculationStepDate: "Esta visualização mostra os diferentes grupos de jogadores que ainda estão jogando no seu servidor. A visualização usa a data lastSeen. Se x < lastSeenDate, o jogador é visível no gráfico."
                calculationStepDeltas: "Esta visualização é mais eficaz usando Contagem de Jogadores como Eixo Y. A visualização mostra o ganho líquido de jogadores (Quantos jogadores entraram menos jogadores que pararam de jogar). A visualização usa ambas as datas registered e lastSeen. Se registerDate < x < lastSeenDate, o jogador é visível no gráfico."
                calculationStepPlaytime: "Esta visualização mostra por quanto tempo o loop de jogo mantém os jogadores engajados no seu servidor. A visualização usa tempo de jogo. Se x < playtime, o jogador é visível no gráfico."
                calculationStepTime: "Esta visualização mostra por quanto tempo as pessoas continuam voltando para jogar no servidor após entrarem pela primeira vez. A visualização usa timeDifference. Se x < timeDifference, o jogador é visível no gráfico."
                compareJoinAddress: "Agrupar por endereço de entrada permite medir campanhas publicitárias em diferentes sites."
                compareMonths: "Você pode comparar meses diferentes alterando a opção '<0>' para '<1>'"
