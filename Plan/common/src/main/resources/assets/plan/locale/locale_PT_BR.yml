                    line-5: "Herança de permissão"
                    line-6: "Permissões seguem modelo de herança, onde permissão de nível superior concede todas as inferiores, ex. <1>{{permission1}}</1> também dá <2>{{permission2}}</2>, etc."
                    line-7: "Acesso vs Permissões de Página"
                    line-8: "Você precisa atribuir permissões de acesso e página para usuários."
