                    line-9: "I permessi <1>{{permission1}}</1> permettono all'utente di fare la richiesta a un indirizzo specifico, es. <2>{{permission2}}</2> permette la richiesta a /network."
            performance:
                cpu: "Valore più grande osservato riportato da Java durante il minuto."
                cpuImpactPerPlayer: "(Utilizzo CPU medio mentre attivo - Utilizzo CPU medio mentre inattivo) / Giocatori online"
                desc-1: "Le metriche di performance sono raccolte tramite un task che si esegue una volta al secondo, e poi salvate una volta al minuto."
                desc-2: "Alcune metriche sono calcolate in modo asincrono per evitare l'impatto sulla velocità dei tick."
                diskSpace: "Valore più piccolo osservato riportato da Java durante il minuto."
                entities: "Numero più grande di entità osservato esistente in un momento durante un minuto. Alcuni server scaricano chunks e entità senza giocatori."
                explanation: "Spiegazione"
                loadedChunks: "Numero più grande di chunks osservato caricato in un momento durante un minuto. Alcuni server scaricano chunks e entità senza giocatori. Non disponibile sui server Sponge a causa dell'impatto sulle prestazioni."
                lowTpsSpikes: "Quando il valore TPS registrato è inferiore a Display_options.Graphs.TPS.Medium_threshold è contato come TPS Basso. Il conteggio dei picchi aumenta solo quando il valore registrato torna sopra la soglia."
                maxFreeDisk: "Spazio disco più grande registrato da Plan nell'intervallo di tempo."
                metric: "Metrica"
                minFreeDisk: "Spazio disco più piccolo registrato da Plan nell'intervallo di tempo."
                mspt: "Millisecondi per tick. Quando un tick di gioco richiede oltre 50 millisecondi è percepito come lag. Il server Minecraft calcola i nanosecondi di ogni tick. Plan salva la media e il 95° percentile una volta al minuto."
                msptImpactChunk: "MSPT Medio / Chunks caricati."
                msptImpactPlayer: "MSPT Medio / Giocatori online."
                msptJitterAverage: "Jitter descrive quanto il valore è cambiato tra tick successivi. Più basso significa tick rate più stabile. MSPT di 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Media=23. La media è usata per evitare di dover salvare 1200 valori al minuto."
                msptJitterMax: "Max Jitter prende il cambiamento di tick successivo più grande. Più alto significa che si è verificato un potenziale picco di lag. MSPT di 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Max=46"
                msptPercentile: "Il 95° percentile significa che il 95% dei valori è sotto questo valore. È una sorta di massimo che esclude i valori anomali."
                ping: "Ritardo misurato dal server Minecraft tra i pacchetti inviati e ricevuti dal client di gioco. Il task si esegue ogni 2 secondi, e Min/Max/Media è raccolto da ogni giocatore separatamente una volta al minuto. Ci sono alcuni ritardi nella configurazione (Ping_server_enable_delay - default 10 minuti, Ping_player_join_delay - default 30 secondi) che filtrano i dati errati dal essere registrati."
                playersOnline: "Il valore del grafico è il massimo osservato entro il minuto."
                ram: "Valore più grande osservato riportato da Java durante il minuto."
                serverDowntime: "Somma delle lacune quando Plan non ha registrato dati. Inizia dal primo datapoint prima della lacuna entro l'intervallo di tempo. Se la raccolta dati termina bruscamente, la lacuna non è contata fino all'arrivo del prossimo datapoint."
                serverUptime: "Somma delle sezioni di tempo quando Plan ha registrato dati. Inizia dal primo datapoint disponibile entro l'intervallo di tempo."
                title: "Metriche di performance spiegate"
                tps: "Tick di gioco al secondo. Minecraft gira a 20 tick al secondo. Il valore del grafico è il valore più piccolo osservato entro il minuto. Valori superiori a 20 possono significare overticking dove il server sta recuperando i tick precedenti."
            playtimeUnit: "ore"
            retention:
                calculationStep1: "Prima i dati sono filtrati usando l'opzione '<>'. Tutti i giocatori con 'registerDate' fuori dall'intervallo di tempo sono ignorati."
                calculationStep2: "Poi è raggruppato in gruppi di giocatori usando l'opzione '<0>', es. Con '<1>': Tutti i giocatori che si sono registrati a Gennaio 2023, Febbraio 2023, ecc"
                calculationStep3: "Poi le opzioni '<0>' e '<1>' selezionano quale visualizzazione rendere."
                calculationStep4: "'<>' controlla quanti punti ha il grafico, es. 'Giorni' ha un punto per giorno."
                calculationStep5: "Su ogni punto calcolato tutti i giocatori sono controllati per la condizione."
                calculationStep6: "Seleziona Asse X sotto per vedere le condizioni."
                calculationStepDate: "Questa visualizzazione mostra i diversi gruppi di giocatori che stanno ancora giocando sul tuo server. La visualizzazione usa la data lastSeen. Se x < lastSeenDate, il giocatore è visibile sul grafico."
                calculationStepDeltas: "Questa visualizzazione è più efficace usando il Conteggio Giocatori come Asse Y. La visualizzazione mostra il guadagno netto di giocatori (Quanti giocatori si sono uniti meno i giocatori che hanno smesso di giocare). La visualizzazione usa sia le date di registrazione che lastSeen. Se registerDate < x < lastSeenDate, il giocatore è visibile sul grafico."
                calculationStepPlaytime: "Questa visualizzazione dice quanto tempo il loop di gioco mantiene i giocatori impegnati sul tuo server. La visualizzazione usa il tempo di gioco. Se x < playtime, il giocatore è visibile sul grafico."
                calculationStepTime: "Questa visualizzazione dice quanto tempo le persone continuano a tornare a giocare sul server dopo essersi unite la prima volta. La visualizzazione usa timeDifference. Se x < timeDifference, il giocatore è visibile sul grafico."
                compareJoinAddress: "Raggruppando per indirizzo di connessione si permette di misurare le campagne pubblicitarie su siti diversi."
                compareMonths: "Puoi confrontare mesi diversi cambiando l'opzione '<0>' a '<1>'"
                examples:
                    adCampaign: "Confronto del guadagno di giocatori di diverse campagne pubblicitarie usando diversi Indirizzi di Connessione (anonimizzati)"
                    deltas: "<> mostra il guadagno netto di giocatori."
                    pattern: "Un pattern generale emerge quando tutti i giocatori iniziano a lasciare il server allo stesso tempo"
                    plateau: "Confronto del guadagno di giocatori di mesi diversi. I plateau suggeriscono che c'erano giocatori di cui Plan non sapeva. In questo esempio Plan è stato installato a Gennaio 2022."
                    playtime: "Il tempo di gioco dice quanto tempo il loop di gioco mantiene i giocatori impegnati sul tuo server."
                    stack: "Il guadagno cumulativo di giocatori può essere controllato con il conteggio dei giocatori accumulato come asse Y"
                howIsItCalculated: "Come è calcolato"
                howIsItCalculatedData: "Il grafico è generato dai dati dei giocatori:"
