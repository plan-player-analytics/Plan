                explanation: "Açıklama"
                loadedChunks: "Bir dakika içinde bir anda yüklenen chunk'ların en büyük gözlemlenen sayısı. Bazı sunucular oyuncusuz chunk'ları ve varlıkları boşaltır. Performans etkisi nedeniyle Sponge sunucularında mevcut değildir."
                lowTpsSpikes: "Kaydedilen TPS değeri Display_options.Graphs.TPS.Medium_threshold'un altında olduğunda Düşük TPS olarak sayılır. Spike-sayısı, kaydedilen değer eşik değerinin üzerine döndüğünde artar."
                maxFreeDisk: "Plan tarafından zaman dilimi içinde kaydedilen en büyük disk alanı."
                metric: "Metrik"
                minFreeDisk: "Plan tarafından zaman dilimi içinde kaydedilen en küçük disk alanı."
                mspt: "Tik başına milisaniye. Bir oyun tiki 50 milisaniyeden fazla sürdüğünde gecikme olarak algılanır. Minecraft sunucusu her tikin nanosaniyelerini hesaplar. Plan, ortalama ve 95. yüzdelik dilimi dakikada bir kez saklar."
                msptImpactChunk: "Ortalama MSPT / Yüklenen chunk'lar."
                msptImpactPlayer: "Ortalama MSPT / Çevrimiçi oyuncular."
                msptJitterAverage: "Jitter, ardışık tikler arasında değerin ne kadar değiştiğini açıklar. Daha düşük, daha kararlı tik oranı anlamına gelir. MSPT 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Ortalama=23. Dakikada 1200 değer saklama ihtiyacını önlemek için ortalama kullanılır."
                msptJitterMax: "Maksimum Jitter, en büyük ardışık tik değişimini alır. Daha yüksek, potansiyel bir gecikme artışı olduğuna işaret eder. MSPT 35, 36, 34, 80, 37 -> Jitter = 1, 2, 46, 43 -> Maks=46"
                msptPercentile: "95. yüzdelik dilim, değerlerin %95'inin bu değerin altında olduğu anlamına gelir. Aykırı değerleri elenen bir tür maksimumdur."
                ping: "Oyun istemcisi tarafından gönderilen ve alınan paketler arasındaki gecikme, Minecraft sunucusu tarafından ölçülür. Görev her 2 saniyede bir çalışır ve Min/Maks/Ortalama, her oyuncu için ayrı olarak dakikada bir kez toplanır. Yapılandırmada bazı gecikmeler vardır (Ping_server_enable_delay - varsayılan 10 dakika, Ping_player_join_delay - varsayılan 30 saniye) ve bunlar çöp verilerin kaydedilmesini filtreler."
                playersOnline: "Grafik değeri, dakika içinde gözlemlenen maksimumdur."
                ram: "Dakika içinde Java tarafından bildirilen en büyük gözlemlenen değer."
                serverDowntime: "Plan'ın veri kaydetmediği boşlukların toplamı. Zaman dilimi içindeki boşluktan önceki ilk veri noktasından başlar. Veri toplama ani sonlanırsa, bir sonraki veri noktası gelene kadar boşluk sayılmaz."
                serverUptime: "Plan'ın veri kaydettiği zaman bölümlerinin toplamı. Zaman dilimi içinde mevcut olan ilk veri noktasından başlar."
                title: "Performans metrikleri açıklaması"
                tps: "Saniye başına oyun tikleri. Minecraft saniyede 20 tikte çalışır. Grafik değeri, dakika içinde gözlemlenen en küçük değerdir. 20'den yüksek değerler, sunucunun önceki tikleri yakalama yaptığı aşırı tiklemeyi ifade edebilir."
            playtimeUnit: "saatler"
            retention:
                calculationStep1: "Önce veri '<>' seçeneği kullanılarak filtrelenir. 'registerDate' zaman aralığının dışında olan tüm oyuncular görmezden gelinir."
                calculationStep2: "Ardından '<0>' seçeneği kullanılarak oyuncu gruplarına ayrılır, örn. '<1>' ile: Ocak 2023, Şubat 2023'te kayıtlı olan tüm oyuncular, vb."
                calculationStep3: "Ardından '<0>' ve '<1>' seçenekleri hangi görselleştirmenin işleneceğini seçer."
                calculationStep4: "'<>' grafiğin kaç noktası olduğunu kontrol eder, örn. 'Günler' günde bir noktaya sahiptir."
                calculationStep5: "Her hesaplanan noktada tüm oyuncular koşul için kontrol edilir."
                calculationStep6: "Koşulları görmek için aşağıdan X Eksenini seçin."
                calculationStepDate: "Bu görselleştirme, sunucunuzda hala oynayan farklı oyuncu gruplarını gösterir. Görselleştirme lastSeen tarihini kullanır. Eğer x < lastSeenDate ise, oyuncu grafikte görünür."
                calculationStepDeltas: "Bu görselleştirme, Y Ekseni olarak Oyuncu Sayısını kullanarak en etkili şekilde çalışır. Görselleştirme oyuncu net kazancını gösterir (Kaç oyuncu katıldı eksi oynamayı bırakan oyuncular). Görselleştirme hem registered hem de lastSeen tarihlerini kullanır. Eğer registerDate < x < lastSeenDate ise, oyuncu grafikte görünür."
                calculationStepPlaytime: "Bu görselleştirme, oyun döngüsünün oyuncuları sunucunuzda ne kadar süreyle meşgul ettiğini söyler. Görselleştirme oyun süresini kullanır. Eğer x < playtime ise, oyuncu grafikte görünür."
                calculationStepTime: "Bu görselleştirme, insanlar ilk kez katıldıktan sonra sunucuda oynamak için ne kadar süreyle geri döndüğünü söyler. Görselleştirme timeDifference kullanır. Eğer x < timeDifference ise, oyuncu grafikte görünür."
                compareJoinAddress: "Katılım adresine göre gruplama, farklı sitelerdeki reklam kampanyalarını ölçmeye olanak tanır."
                compareMonths: "'<0>' seçeneğini '<1>' olarak değiştirerek farklı ayları karşılaştırabilirsiniz"
                examples:
                    adCampaign: "Farklı Katılım Adreslerini kullanarak farklı reklam kampanyalarının oyuncu kazancını karşılaştırma (anonimleştirilmiş)"
                    deltas: "<> oyuncu net kazancını gösterir."
                    pattern: "Tüm oyuncular aynı anda sunucuyu terk etmeye başladığında genel bir örüntü ortaya çıkar"
                    plateau: "Farklı ayların oyuncu kazancını karşılaştırma. Platólar, Plan'ın bilmediği oyuncular olduğunu gösterir. Bu örnekte Plan Ocak 2022'de kuruldu."
                    playtime: "Oyun süresi, oyun döngüsünün oyuncuları sunucunuzda ne kadar süreyle meşgul ettiğini söyler."
                    stack: "Kümülatif oyuncu kazancı, Y ekseni olarak yığılmış oyuncu sayısı ile kontrol edilebilir"
