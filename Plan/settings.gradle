pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "Plan"

include "api"
include "common"
include "bukkit"
include "sponge"
include "nukkit"
include "bungeecord"
include "velocity"
include "plugin"
include "extensions"
include "extensions:adventure"
include "fabric"
include "neoforge"
include "folia"
